spring:
  application:
    name: qr-text-capture
  datasource:
    url: jdbc:sqlite:${DB_FILE:./data/qr-text-capture.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  test-user:
    enabled: ${APP_TEST_USER_ENABLED:false}
    name: ${APP_TEST_USER_NAME:Usuário de Testes}
    email: ${APP_TEST_USER_EMAIL:teste@localhost}
    password: ${APP_TEST_USER_PASSWORD:Teste123!}
server:
  forward-headers-strategy: framework
  error:
    include-message: always
