<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Criar conta</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="card narrow"><div th:replace="~{fragments :: alerts}"></div><h1>Criar conta</h1><form action="/cadastrar" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nome<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="password" minlength="8" required></label><button class="button">Cadastrar</button></form><p><a href="/login">Já tenho conta</a></p></main></body></html>
