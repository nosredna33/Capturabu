<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title th:text="${title}">Acesso</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="card narrow"><div th:replace="~{fragments :: alerts}"></div><h1 th:text="${title}">Acesso</h1><form th:action="${action}" method="post"><label th:if="${register}">Nome<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="password" minlength="8" required></label><button class="button" type="submit" th:text="${register ? 'Cadastrar' : 'Entrar'}"></button></form><p><a th:href="${register ? '/login' : '/cadastrar'}" th:text="${register ? 'Já tenho conta' : 'Criar uma conta'}"></a></p></main></body></html>
