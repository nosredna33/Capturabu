<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Capturas</title><link rel="stylesheet" href="/css/app.css"><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script><script src="/js/qr-reader.js" defer></script></head><body><header th:replace="~{fragments :: header}"></header><main><div th:replace="~{fragments :: alerts}"></div><section class="card"><h1>Ler QR Code</h1><ol class="steps"><li id="stepImage" class="active">1. Selecionar imagem</li><li id="stepSelect">2. Selecionar região</li><li id="stepCrop">3. Cortar</li><li id="stepRead">4. Ler QR Code</li><li id="stepText">5. Conferir texto</li><li id="stepSave">6. Salvar</li></ol><div class="reader-grid"><div class="reader-column"><h2>Canvas 1 — imagem para seleção</h2><label class="file-label">Selecionar imagem<input id="imageInput" type="file" accept="image/*"></label><div class="image-preview"><canvas id="imageCanvas" class="qr-canvas" hidden></canvas></div><button id="selectArea" class="button" type="button" disabled>Selecionar região</button><button id="cropButton" class="button secondary" type="button" disabled>✂️ Cortar</button><p id="scanStatus" class="scan-status">Nenhuma imagem selecionada.</p></div><div class="reader-column"><h2>Canvas 2 — preview do corte original</h2><div class="crop-preview"><canvas id="cropCanvas" class="crop-canvas" hidden></canvas></div><button id="readQr" class="button" type="button" disabled>Ler QR Code</button><div id="textPanel" class="text-panel" hidden><h2>Texto reconhecido</h2><textarea id="capturedText" readonly rows="7"></textarea><button id="saveDetected" class="button" type="button" disabled>Salvar no banco</button></div></div></div><form id="saveForm" action="/capturas/salvar-texto" method="post" hidden><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input id="qrContent" name="content"><input id="qrSource" name="sourceName"></form></section><section class="card"><h2>Histórico</h2><div class="empty" th:if="${#lists.isEmpty(captures)}">Nenhuma captura ainda.</div><article class="capture" th:each="c : ${captures}"><div><small th:text="${c.sourceName + ' · ' + c.createdAt}"></small><pre th:text="${c.content}"></pre></div><form class="delete-capture-form" th:action="@{/capturas/{id}/excluir(id=${c.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="danger" type="submit">Excluir</button></form></article></section></main></body></html>
