<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Usuários</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="card"><h1>Usuários</h1><div class="user" th:each="u : ${users}"><form th:action="@{/usuarios/{id}/editar(id=${u.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="name" th:value="${u.name}" required><input type="email" name="email" th:value="${u.email}" required><select name="role"><option value="USER" th:selected="${u.role == 'USER'}">USER</option><option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option></select><label class="check"><input type="checkbox" name="enabled" th:checked="${u.enabled}"> ativo</label><button class="button small">Salvar</button></form><form th:action="@{/usuarios/{id}/excluir(id=${u.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="danger">Excluir</button></form></div></section></main></body></html>
