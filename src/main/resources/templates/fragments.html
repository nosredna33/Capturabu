<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="header" class="top"><a class="brand" href="/">QR Text Capture</a><nav><a href="/capturas" th:if="${#authorization.expression('isAuthenticated()')}">Capturas</a><a href="/usuarios" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Usuários</a><form th:if="${#authorization.expression('isAuthenticated()')}" method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link">Sair</button></form></nav></header>
<div th:fragment="alerts"><div class="alert ok" th:if="${message != null or success != null}" th:text="${message != null ? message : success}"></div><div class="alert error" th:if="${error != null}" th:text="${error}"></div></div>
</body></html>
