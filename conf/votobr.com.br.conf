<VirtualHost *:80>
    ServerName votobr.com.br
    ServerAlias votobr.com.br

    # Configuração do Proxy Reverso
    ProxyPreserveHost On
    ProxyPass / http://localhost:8889/
    ProxyPassReverse / http://localhost:8889/

    # Passa os cabeçalhos originais para a aplicação Java saber a origem real
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/votobr.log
    CustomLog ${APACHE_LOG_DIR}/votobr_access.log combined
</VirtualHost>
